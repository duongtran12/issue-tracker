spring:
  datasource:
    url: jdbc:h2:mem:issue_tracker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_TO_STRING_FORMAT=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
