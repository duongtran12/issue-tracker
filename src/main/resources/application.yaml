spring:
  application:
    name: issue-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issue_tracker}
    username: ${DB_USERNAME:issue_tracker}
    password: ${DB_PASSWORD:issue_tracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
