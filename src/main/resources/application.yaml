spring:
  application:
    name: issue-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issue_tracker}
    username: ${DB_USERNAME:issue_tracker}
    password: ${DB_PASSWORD:issue_tracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-with-at-least-256-bits-secret-key-for-security}
    expiration: ${JWT_EXPIRATION:3600000}
